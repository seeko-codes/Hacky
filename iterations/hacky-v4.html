<script>
const $=id=>document.getElementById(id),mobile=matchMedia('(max-width:700px)');
const people={mika:{name:'Mika Chen',role:'Full-stack · React / Node',reason:'Ships end to end with React, Node, and Postgres. Looking for a team, and very ready to talk anime.',tags:['Full-stack','Anime fan'],reply:'Hey! I’m looking for a team too. What are you building?'},ren:{name:'Ren Okada',role:'Full-stack · Next.js / Python',reason:'Built two hackathon projects from UI to API. Loves fast prototypes, clean code, and Studio Ghibli.',tags:['Full-stack','Ghibli fan'],reply:'Hey! I’d love to hear the idea. What’s your team building?'},aya:{name:'Aya Patel',role:'Security · AppSec / CTFs',reason:'Enjoys CTFs and finding auth bugs. Can help your team build a safer app from the start.',tags:['App security','CTFs'],reply:'Hey! Happy to help with security. What does your app do?'},jules:{name:'Jules Park',role:'Product design · Frontend',reason:'Turns rough ideas into polished interfaces. Comfortable with Figma, CSS, and building alongside engineers.',tags:['Design','Frontend'],reply:'Hi! I’m up for a design sprint. What’s the project?'}};
const histories={team:[{sender:'Kai',text:"Who's finding our fourth? We could use someone who can own the full stack."},{sender:'Lena',text:'I’m on the interface. Let’s find someone excited about the idea.'}]},discovered=['mika','ren'];let current=null,busy=false,opened=!mobile.matches;
const avatar=id=>'<span class="avatar '+id+'">'+(id==='team'?'⚔':'<svg aria-hidden="true"><use href="#face"/></svg>')+'</span>';
function setOpen(value,focus=false){opened=value;$('app').classList.toggle('open',value);$('sidebar').inert=!value;$('main').inert=value&&mobile.matches;$('toggle').setAttribute('aria-expanded',String(value));if(focus)(value?$('close-sidebar'):$('toggle')).focus({preventScroll:true});}setOpen(opened);$('toggle').onclick=()=>setOpen(!opened,true);$('close-sidebar').onclick=()=>setOpen(false,true);$('backdrop').onclick=()=>setOpen(false,true);mobile.addEventListener('change',()=>setOpen(!mobile.matches));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened)setOpen(false,true);if(e.key==='Tab'&&opened&&mobile.matches){const controls=[...$('sidebar').querySelectorAll('button,textarea')].filter(el=>!el.disabled&&el.getClientRects().length),first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function renderContacts(){$('contacts').replaceChildren();discovered.forEach(id=>{const p=people[id],b=document.createElement('button');b.className='contact';b.innerHTML=avatar(id)+'<span class="info"><span class="name">'+p.name+'</span><div class="preview">'+(histories[id]?.length?'Conversation started':p.role)+'</div></span>';b.onclick=()=>openConversation(id);$('contacts').append(b);});}
function drawDm(){$('dm-feed').replaceChildren();(histories[current]||[]).forEach(m=>{const el=document.createElement('div');el.className='bubble'+(m.mine?' mine':'');if(!m.mine){const sender=document.createElement('div');sender.className='sender';sender.textContent=m.sender;el.append(sender);}el.append(document.createTextNode(m.text));$('dm-feed').append(el);});if(!histories[current]?.length){const el=document.createElement('p');el.className='empty';el.textContent='Hacky brought you together! Say hello and tell them what you’re building.';$('dm-feed').append(el);}$('dm-feed').scrollTop=$('dm-feed').scrollHeight;}
function openConversation(id){current=id;histories[id]??=[];$('sidebar').classList.add('in-thread');$('dm-avatar').innerHTML=avatar(id);$('dm-title').textContent=id==='team'?'Midnight builders':people[id].name;$('dm-role').textContent=id==='team'?'Your team · 3 members':people[id].role;$('dm-input').value='';update($('dm-input'),$('dm-send'));drawDm();setOpen(true);$('dm-input').focus({preventScroll:true});}
$('team').onclick=()=>openConversation('team');$('back-list').onclick=()=>{$('sidebar').classList.remove('in-thread');current=null;};
function update(input,button){input.style.height='40px';input.style.height=Math.min(116,input.scrollHeight)+'px';button.disabled=!input.value.trim()||(button.id==='finder-send'&&busy);}
function wire(input,button,form){input.oninput=()=>update(input,button);input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!button.disabled)form.requestSubmit();}};}wire($('finder-input'),$('finder-send'),$('finder-form'));wire($('dm-input'),$('dm-send'),$('dm-form'));
$('dm-form').onsubmit=e=>{e.preventDefault();const text=$('dm-input').value.trim();if(!text||!current)return;const id=current;histories[id].push({mine:true,text});$('dm-input').value='';update($('dm-input'),$('dm-send'));drawDm();if(id==='team')$('team-preview').textContent='You: '+text;renderContacts();setTimeout(()=>{histories[id].push({sender:id==='team'?'Kai':people[id].name.split(' ')[0],text:id==='team'?'Sounds good! Send the matches here and we can meet them.':people[id].reply});if(current===id)drawDm();renderContacts();},900);};
function message(text,user=false){const el=document.createElement('div');el.className='msg '+(user?'user':'assistant');if(!user)el.innerHTML='<div class="byline"><img src="../assets/mascots/png/hacky-mascot.png" alt="">Hacky<span class="byline-bolt" aria-hidden="true">ϟ</span></div>';const p=document.createElement('p');p.textContent=text;el.append(p);$('thread').append(el);return el;}
function matches(parent,ids){const list=document.createElement('div');list.className='matches';ids.forEach(id=>{if(!discovered.includes(id))discovered.push(id);const p=people[id],card=document.createElement('article');card.className='match';card.innerHTML='<div class="match-top">'+avatar(id)+'<div><div class="name">'+p.name+'</div><div class="role">'+p.role+'</div></div></div><p class="reason">'+p.reason+'</p><div class="bottom"><div class="tags">'+p.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div><button class="hi" aria-label="Message '+p.name+'">Say hi ↗</button></div>';card.querySelector('button').onclick=()=>openConversation(id);list.append(card);});parent.append(list);renderContacts();}
function find(text){if(busy)return;busy=true;message(text,true);const pending=message('On it! Let me find your people…');pending.classList.add('waiting');$('finder-input').value='';update($('finder-input'),$('finder-send'));$('feed').scrollTop=$('feed').scrollHeight;setTimeout(()=>{pending.remove();const q=text.toLowerCase();let ids=[],reply;if(/security|secure|ctf|appsec|cyber/.test(q)){ids=['aya'];reply='Found your security hero! Aya’s into hands-on AppSec and CTFs. Here’s why I’d introduce you.';}else if(/design|figma|ui|ux|frontend|front-end/.test(q)&&!/full/.test(q)){ids=['jules'];reply='Ooh, meet Jules! They can turn your idea into an interface your team will love building.';}else if(/full.?stack|backend|back.end|react|node|python|team|build|anime|ghibli/.test(q)){ids=['mika','ren'];reply='Found two potential squadmates! Both build across the stack, love anime, and are looking for a team.';}else{reply='Tell me what you’re building and who you need! I can introduce sample full-stack, security, and design teammates in this demo.';}const answer=message(reply);if(ids.length){matches(answer,ids);const note=document.createElement('p');note.style.cssText='font-size:11px;color:#806b92;margin-top:14px';note.textContent='I added them to your chats. Go say hi!';answer.append(note);}busy=false;update($('finder-input'),$('finder-send'));$('feed').scrollTop=$('feed').scrollHeight;},650);}
$('finder-form').onsubmit=e=>{e.preventDefault();const text=$('finder-input').value.trim();if(text)find(text);};
message('Find me a full-stack teammate who loves anime.',true);matches(message('Found two potential squadmates! Both build across the stack, love anime, and are looking for a team.'),['mika','ren']);const suggestions=document.createElement('div');suggestions.className='suggestions';[['Security specialist','Find someone good at security'],['Design teammate','Find a designer for our team']].forEach(([label,prompt])=>{const b=document.createElement('button');b.className='suggestion';b.textContent=label;b.onclick=()=>find(prompt);suggestions.append(b);});$('thread').append(suggestions);
if(window.visualViewport){const fit=()=>{$('app').style.height=window.visualViewport.height+'px';};window.visualViewport.addEventListener('resize',fit);fit();}
</script><script src="../app/hacky-customizer.js"></script></body></html>
