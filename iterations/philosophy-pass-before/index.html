<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffefb"><title>Hacky · Find your hackathon crew</title>
<link rel="stylesheet" href="hacky.css"><link rel="stylesheet" href="hacky-customizer.css"></head><body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><symbol id="face" viewBox="0 0 32 32"><path d="m7 13 3-7 6 4 5-4 4 7v9c0 5-18 5-18 0Z"/><path d="M11 17v2m10-2v2m-7 3h4"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol><symbol id="chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 13h5"/></symbol><symbol id="bolt" viewBox="0 0 24 24"><path d="m13 2-8 12h6l-1 8 9-12h-6Z"/></symbol><symbol id="people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M16 3a4 4 0 0 1 0 8"/></symbol><symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></symbol><symbol id="music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 8l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></symbol><symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol><symbol id="shuffle" viewBox="0 0 24 24"><path d="m18 3 3 3-3 3M3 6h3c5 0 7 12 12 12h3m-3-3 3 3-3 3M3 18h3c2 0 4-3 6-6s4-6 6-6h3"/></symbol><symbol id="smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9h.01M16 9h.01M8 14c2 3 6 3 8 0"/></symbol><symbol id="up" viewBox="0 0 24 24"><path d="M12 20V4m-5 5 5-5 5 5"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m6 6 12 12"/></symbol></defs></svg>
<div id="app" class="app"><aside id="sidebar" class="sidebar" aria-label="Team and direct messages"><div class="side-inner"><header class="side-header"><div class="brand">hacky<svg class="brand-bolt" aria-hidden="true"><use href="#bolt"/></svg></div><button id="close-sidebar" class="icon" aria-label="Hide chats"><svg><use href="#close"/></svg></button></header>
<div class="list"><div class="event"><img class="mlh-logo" src="../../assets/brand/mlh-logo-color.svg" alt="Major League Hacking"><span class="event-divider"></span><span>Knight Hacks<br><small>Hackathon demo</small></span></div><div class="contacts"><h2 class="label">Your party</h2><button id="team" class="contact team"><span class="avatar team"><svg aria-hidden="true"><use href="#people"/></svg></span><span class="info"><span class="name">Midnight builders</span><div class="preview" id="team-preview">Kai: Who's finding our fourth?</div></span><span class="dot"></span></button><h2 class="label people">People</h2><div id="contacts"></div></div><div class="foot">Fictional people · demo conversations</div></div>
<section class="dm" aria-label="Selected conversation"><header class="dm-header"><button id="back-list" class="icon" aria-label="Back to chats"><svg><use href="#back"/></svg></button><div id="dm-avatar"></div><div><div class="name" id="dm-title"></div><div class="role" id="dm-role"></div></div></header><div id="dm-profile" class="dm-profile" hidden></div><div id="dm-feed" class="dm-feed" role="log" aria-live="polite" aria-label="Messages"></div><form id="dm-form" class="dm-compose"><div class="composer"><textarea id="dm-input" aria-label="Message selected conversation" placeholder="Say hello…" rows="1" enterkeyhint="send"></textarea><button id="dm-send" class="send" aria-label="Send demo message" disabled><svg><use href="#arrow"/></svg></button></div></form><div class="foot">Sample replies · no messages are sent</div></section></div></aside><button id="backdrop" class="backdrop" aria-label="Return to finder" tabindex="-1"></button>
<main id="main" class="main"><header class="header"><button id="toggle" class="toggle" aria-expanded="false" aria-controls="sidebar"><svg><use href="#chat"/></svg>Chats</button><div class="title">Hacky</div><span class="demo">DEMO</span></header><div class="feed" id="feed"><div class="intro"><div class="intro-copy"><h1>Who do you need<br><span>on your team?</span></h1><div class="intro-note">Tell Hacky what you’re building.</div></div><div class="mascot-stage"><img src="../../assets/mascots/webp/hacky-mascot.webp" alt="Hacky, a smiling little robot in a blue hoodie, waving and holding a star"></div></div><div id="thread" class="thread" role="log" aria-live="polite" aria-label="Conversation with Hacky"></div></div><div class="compose-wrap"><form id="finder-form" class="composer"><textarea id="finder-input" aria-label="Tell Hacky who you want to meet" placeholder="Hacky, I need someone who…" rows="1" enterkeyhint="send"></textarea><button id="finder-send" class="send" aria-label="Find people" disabled><svg><use href="#arrow"/></svg></button></form></div></main></div>
<template id="message-action-template"><button class="hi"><svg aria-hidden="true"><use href="#chat"/></svg><span class="chat-label"></span></button></template>
<script>
const $=id=>document.getElementById(id),mobile=matchMedia('(max-width:700px)');
const people={mika:{name:'Mika Chen',role:'Full-stack · React / Node',reason:'Ships end to end with React, Node, and Postgres. Looking for a team, and very ready to talk anime.',tags:['Full-stack','Anime fan'],reply:'Hey! I’m looking for a team too. What are you building?'},ren:{name:'Ren Okada',role:'Full-stack · Next.js / Python',reason:'Built two hackathon projects from UI to API. Loves fast prototypes, clean code, and Studio Ghibli.',tags:['Full-stack','Ghibli fan'],reply:'Hey! I’d love to hear the idea. What’s your team building?'},aya:{name:'Aya Patel',role:'Security · AppSec / CTFs',reason:'Enjoys CTFs and finding auth bugs. Can help your team build a safer app from the start.',tags:['App security','CTFs'],reply:'Hey! Happy to help with security. What does your app do?'},jules:{name:'Jules Park',role:'Product design · Frontend',reason:'Turns rough ideas into polished interfaces. Comfortable with Figma, CSS, and building alongside engineers.',tags:['Design','Frontend'],reply:'Hi! I’m up for a design sprint. What’s the project?'}};
Object.assign(people.mika,{kind:'Hacker',bio:'Looking for a team. Enjoys anime and building through the night.',github:null,linkedin:null,reason:'Can own your UI and API, wants a team, and shares your love of anime.'});
Object.assign(people.ren,{kind:'Hacker',bio:'Two hackathons completed. Studio Ghibli fan.',github:null,linkedin:null,reason:'Has shipped complete hackathon projects and is ready to build across the stack.'});
Object.assign(people.aya,{kind:'Mentor',bio:'Helps teams review authentication and threat models. CTF enthusiast.',github:null,linkedin:null,reason:'Can review your security approach and help catch auth issues before your demo.'});
Object.assign(people.jules,{kind:'Hacker',bio:'Designs in Figma and builds accessible interfaces.',github:null,linkedin:null,reason:'A strong fit if your team needs someone to turn an idea into a polished interface.'});
const socialIcons={github:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1-.3-2-1-2 4-.5 7-2 7-6 0-1.5-.5-3-1.5-4 .2-1 0-2-.5-3-2 0-3 1-4 1a15 15 0 0 0-6 0c-1 0-2-1-4-1-.5 1-.7 2-.5 3C3.5 7 3 8.5 3 10c0 4 3 5.5 7 6-.7.5-1 1.5-1 2v4"/></svg>',linkedin:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 10v7m0-10v.1m5 9.9v-7m0 3c0-4 5-4 5 0v4"/></svg>'};
function socials(id){const p=people[id];return '<div class="socials">'+['github','linkedin'].map(platform=>'<button class="social-link" data-person="'+id+'" data-platform="'+platform+'" aria-label="'+(platform==='github'?'GitHub':'LinkedIn')+' profile for '+p.name+'">'+socialIcons[platform]+(platform==='github'?'GitHub':'LinkedIn')+'</button>').join('')+'</div>';}
document.addEventListener('click',e=>{const button=e.target.closest('[data-platform]');if(!button)return;const person=people[button.dataset.person],platform=button.dataset.platform;if(person[platform]){window.open(person[platform],'_blank','noopener,noreferrer');return;}let notice=button.parentElement.querySelector('.social-notice');if(!notice){notice=document.createElement('p');notice.className='social-notice';notice.setAttribute('role','status');button.parentElement.append(notice);}notice.textContent='Demo profile · No '+(platform==='github'?'GitHub':'LinkedIn')+' account connected.';});
const histories={team:[{sender:'Kai',text:"Who's finding our fourth? We could use someone who can own the full stack."},{sender:'Lena',text:'I’m on the interface. Let’s find someone excited about the idea.'}]},discovered=['mika','ren'];let current=null,busy=false,opened=!mobile.matches;
const avatar=id=>'<span class="avatar '+id+'">'+(id==='team'?'<svg aria-hidden="true"><use href="#people"/></svg>':people[id].name.split(' ').map(part=>part[0]).join(''))+'</span>';
function setOpen(value,focus=false){opened=value;$('app').classList.toggle('open',value);$('sidebar').inert=!value;$('main').inert=value&&mobile.matches;$('toggle').setAttribute('aria-expanded',String(value));if(focus)(value?$('close-sidebar'):$('toggle')).focus({preventScroll:true});}setOpen(opened);$('toggle').onclick=()=>setOpen(!opened,true);$('close-sidebar').onclick=()=>setOpen(false,true);$('backdrop').onclick=()=>setOpen(false,true);mobile.addEventListener('change',()=>setOpen(!mobile.matches));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened&&!document.querySelector('dialog[open]'))setOpen(false,true);if(e.key==='Tab'&&opened&&mobile.matches&&!document.querySelector('dialog[open]')){const controls=[...$('sidebar').querySelectorAll('button,a,textarea')].filter(el=>!el.disabled&&el.getClientRects().length),first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function renderContacts(){$('contacts').replaceChildren();discovered.forEach(id=>{const p=people[id],b=document.createElement('button');b.className='contact';b.innerHTML=avatar(id)+'<span class="info"><span class="name">'+p.name+'</span><div class="preview">'+(histories[id]?.length?'Conversation started':p.role)+'</div></span>';b.onclick=()=>openConversation(id);$('contacts').append(b);});}
function drawDm(){$('dm-feed').replaceChildren();(histories[current]||[]).forEach(m=>{const el=document.createElement('div');el.className='bubble'+(m.mine?' mine':'');if(!m.mine){const sender=document.createElement('div');sender.className='sender';sender.textContent=m.sender;el.append(sender);}el.append(document.createTextNode(m.text));$('dm-feed').append(el);});if(!histories[current]?.length){const el=document.createElement('p');el.className='empty';el.textContent='Introduce yourself and tell them what you’re building.';$('dm-feed').append(el);}$('dm-feed').scrollTop=$('dm-feed').scrollHeight;}
function openConversation(id){current=id;histories[id]??=[];$('sidebar').classList.add('in-thread');$('dm-avatar').innerHTML=avatar(id);$('dm-title').textContent=id==='team'?'Midnight builders':people[id].name;$('dm-role').textContent=id==='team'?'Your team · 3 members':people[id].kind+' · '+people[id].role;const profile=$('dm-profile');profile.hidden=id==='team';profile.innerHTML=id==='team'?'':'<span class="person-kind">'+people[id].kind+'</span><p class="person-bio">'+people[id].bio+'</p>'+socials(id);$('dm-input').value='';update($('dm-input'),$('dm-send'));drawDm();setOpen(true);$('dm-input').focus({preventScroll:true});}
$('team').onclick=()=>openConversation('team');$('back-list').onclick=()=>{$('sidebar').classList.remove('in-thread');current=null;};
function update(input,button){input.style.height='40px';input.style.height=Math.min(116,input.scrollHeight)+'px';button.disabled=!input.value.trim()||(button.id==='finder-send'&&busy);}
function wire(input,button,form){input.oninput=()=>update(input,button);input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!button.disabled)form.requestSubmit();}};}wire($('finder-input'),$('finder-send'),$('finder-form'));wire($('dm-input'),$('dm-send'),$('dm-form'));
$('dm-form').onsubmit=e=>{e.preventDefault();const text=$('dm-input').value.trim();if(!text||!current)return;const id=current;histories[id].push({mine:true,text});$('dm-input').value='';update($('dm-input'),$('dm-send'));drawDm();if(id==='team')$('team-preview').textContent='You: '+text;renderContacts();setTimeout(()=>{histories[id].push({sender:id==='team'?'Kai':people[id].name.split(' ')[0],text:id==='team'?'Sounds good! Send the matches here and we can meet them.':people[id].reply});if(current===id)drawDm();renderContacts();},900);};
function message(text,user=false){const el=document.createElement('div');el.className='msg '+(user?'user':'assistant');if(!user)el.innerHTML='<div class="byline">Hacky</div>';const p=document.createElement('p');p.textContent=text;el.append(p);$('thread').append(el);return el;}
function matches(parent,ids){const list=document.createElement('div');list.className='matches';ids.forEach(id=>{if(!discovered.includes(id))discovered.push(id);const p=people[id],card=document.createElement('article');card.className='match';card.innerHTML='<div class="match-top">'+avatar(id)+'<div class="info"><div class="name-line"><div class="name">'+p.name+'</div><span class="person-kind">'+p.kind+'</span></div><div class="role">'+p.role+'</div></div></div><p class="person-bio">'+p.bio+'</p><p class="reason"><span class="reason-label">Team fit:</span> '+p.reason+'</p>'+socials(id)+'<div class="bottom"><button class="hi" aria-label="Message '+p.name+'">Say hi</button></div>';const button=$('message-action-template').content.firstElementChild.cloneNode(true);button.querySelector('.chat-label').textContent='Chat with '+p.name.split(' ')[0];button.setAttribute('aria-label','Message '+p.name);button.onclick=()=>openConversation(id);card.querySelector('.hi').replaceWith(button);list.append(card);});parent.append(list);renderContacts();}
function find(text){if(busy)return;busy=true;message(text,true);const pending=message('On it! Let me find your people…');pending.classList.add('waiting');$('finder-input').value='';update($('finder-input'),$('finder-send'));$('feed').scrollTop=$('feed').scrollHeight;setTimeout(()=>{pending.remove();const q=text.toLowerCase();let ids=[],reply;if(/mentor|security|secure|ctf|appsec|cyber/.test(q)){ids=['aya'];reply='Aya is a security mentor who can help review your app.';}else if(/design|figma|ui|ux|frontend|front-end/.test(q)&&!/full/.test(q)){ids=['jules'];reply='Jules works on design and frontend. Here’s their demo profile.';}else if(/full.?stack|backend|back.end|react|node|python|team|build|anime|ghibli/.test(q)){ids=['mika','ren'];reply='Mika and Ren both build across the stack and share your interest in anime.';}else{reply='Tell me what you’re building and who you need! I can introduce sample full-stack, security, and design teammates in this demo.';}const answer=message(reply);if(ids.length){matches(answer,ids);const note=document.createElement('p');note.style.cssText='font-size:11px;color:var(--muted);margin-top:14px';note.textContent='You can find these people in Chats.';answer.append(note);}busy=false;update($('finder-input'),$('finder-send'));$('feed').scrollTop=$('feed').scrollHeight;},650);}
$('finder-form').onsubmit=e=>{e.preventDefault();const text=$('finder-input').value.trim();if(text)find(text);};
message('Find me a full-stack teammate who loves anime.',true);matches(message('Mika and Ren both build across the stack and share your interest in anime.'),['mika','ren']);const suggestions=document.createElement('div');suggestions.className='suggestions';[['Security specialist','Find someone good at security'],['Design teammate','Find a designer for our team']].forEach(([label,prompt])=>{const b=document.createElement('button');b.className='suggestion';b.textContent=label;b.onclick=()=>find(prompt);suggestions.append(b);});$('thread').append(suggestions);
if(window.visualViewport){const fit=()=>{$('app').style.height=window.visualViewport.height+'px';};window.visualViewport.addEventListener('resize',fit);fit();}
</script><script src="../../app/hacky-customizer.js"></script></body></html>
